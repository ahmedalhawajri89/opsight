name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filtering is the operational cost of the monorepo (ADR-004), paid here
  # once: a frontend-only change must not run the PHP suite, and vice versa.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # A REAL MySQL, never SQLite. SQLite differs on DECIMAL handling, CHECK
      # constraints, foreign keys and SELECT ... FOR UPDATE — exactly the
      # features this schema relies on (TESTING_STRATEGY.md §3).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: opsight_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatting
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migrations apply and roll back
        # down() is executed, not assumed to work (TESTING_STRATEGY.md §8).
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: opsight_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Tests
        run: ./vendor/bin/pest

      - name: Dependency audit
        run: composer audit --abandoned=report

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        # Includes the rule forbidding physical CSS direction properties, which
        # is what keeps Phase 07's RTL work a translation task (UI_UX §10).
        run: npm run lint

      - name: Unit and component tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # E2E is slow, so it runs on main and nightly rather than on every push
  # (TESTING_STRATEGY.md §5).
  e2e:
    name: End-to-end
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: opsight
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the API with seeded data
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force
          php artisan serve --port=8000 &
          npx --yes wait-on http://localhost:8000/api/v1/health

      - name: Run Playwright
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
